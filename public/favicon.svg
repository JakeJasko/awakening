<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E27D60" />
      <stop offset="70%" stop-color="#B84A39" />
      <stop offset="100%" stop-color="#2B4E7A" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D070" />
      <stop offset="100%" stop-color="#C28222" />
    </linearGradient>
  </defs>
  <!-- Background disc -->
  <circle cx="50" cy="50" r="46" fill="#151413" stroke="url(#goldGrad)" stroke-width="2.5" />
  <!-- Greek Key / Inner ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#B84A39" stroke-width="1.2" stroke-dasharray="3, 2" opacity="0.7" />
  <!-- Central Eye / Ray of Illumination (Anagoge) -->
  <path d="M 22 50 Q 50 24 78 50 Q 50 76 22 50 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="50" cy="50" r="10" fill="#B84A39" />
  <circle cx="50" cy="50" r="5" fill="#FAF7F2" />
  <!-- Top ray / flame symbol -->
  <path d="M 50 18 L 50 26 M 50 74 L 50 82 M 18 50 L 26 50 M 74 50 L 82 50" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
</svg>
